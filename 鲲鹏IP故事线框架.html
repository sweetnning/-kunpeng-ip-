<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲲鹏IP故事线框架</title>
<style>
:root {
  --bg:#f7f5f2; --surface:#fff; --text:#2c2c2c; --muted:#999;
  --border:#e8e4dc; --dark:#2c2c38; --gold:#b8860b;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.04);
  --red:#c0392b; --amber:#b8860b; --green:#507050;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

/* Cover */
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.cover .icon{width:64px;height:64px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.8rem}
.cover h1{font-size:1.8rem;font-weight:800;margin-bottom:6px}
.cover .sub{color:var(--muted);margin-bottom:10px}
.cover .src{color:#ccc;font-size:0.75rem;margin-bottom:32px}
.cover .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cover .btn{padding:12px 28px;border-radius:50px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-a{background:var(--dark);color:#fff}.btn-a:hover{background:#3a3a4a}
.btn-b{background:var(--surface);color:var(--dark);border:1px solid var(--border)}.btn-b:hover{background:#f5f5f5}
.cover .note{color:#bbb;font-size:0.75rem;margin-top:36px;max-width:500px}
.cover .legend{display:flex;gap:12px;margin-top:20px;font-size:0.78rem;color:var(--muted)}
.cover .legend span{padding:3px 10px;border-radius:50px;background:var(--surface);box-shadow:var(--shadow)}

/* App */
.app{display:none;min-height:100vh}.app.active{display:block}.cover.hidden{display:none}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:24px}
.topbar .back{color:var(--muted);cursor:pointer;font-size:0.85rem;padding:14px 0;transition:.12s}.topbar .back:hover{color:var(--text)}
.topbar .tabs{display:flex;gap:4px}
.topbar .tab{padding:14px 20px;border:none;background:none;cursor:pointer;font-size:0.88rem;color:var(--muted);border-bottom:2px solid transparent;transition:.12s;font-weight:500}
.topbar .tab.active{color:var(--text);border-bottom-color:var(--gold)}
.topbar .tab:hover{color:var(--text)}

.section{max-width:960px;margin:0 auto;padding:32px 24px}
.section h2{font-size:1.25rem;margin-bottom:6px}
.section .chapeau{color:var(--muted);font-size:0.88rem;margin-bottom:24px}

/* Cards */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
.card h4{font-size:0.95rem;margin-bottom:6px}
.card p,.card li{font-size:0.85rem;color:#666;line-height:1.7}
.card ul{margin-left:16px}

/* Chars */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.char{background:var(--surface);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);text-align:center}
.char .avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.char .cname{font-weight:700;font-size:0.88rem;margin-bottom:3px}
.char .ctag{font-size:0.73rem;color:var(--gold);margin-bottom:5px}
.char .cdesc{font-size:0.78rem;color:#888;line-height:1.4}

/* Phases */
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.phase{background:var(--surface);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.phase .pemoji{font-size:1.4rem;margin-bottom:6px}
.phase .pname{font-weight:700;font-size:0.9rem;margin-bottom:2px}
.phase .pwhen{font-size:0.76rem;color:var(--gold);margin-bottom:8px}
.phase .pdesc{font-size:0.82rem;color:#888;line-height:1.5}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* Tags */
.tag{display:inline-block;padding:2px 10px;border-radius:50px;font-size:0.72rem;font-weight:600;margin:2px}
.tag-red{background:#fce4e4;color:var(--red)}.tag-amber{background:#fef5e7;color:var(--amber)}.tag-green{background:#eaf7ea;color:var(--green)}

/* Row split */
.row-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media(max-width:768px){
  .cover h1{font-size:1.3rem}
  .section{padding:20px 16px}
  .row-split{grid-template-columns:1fr}
  .chars{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
